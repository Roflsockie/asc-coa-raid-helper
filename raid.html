<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Raid · Raid-COA</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <div class="container">
      <a href="index.html" class="header-title">Raid<span>COA</span></a>
      <div class="header-actions">
        <button id="manage-managers-btn" class="btn btn-sm hidden" onclick="manageManagers()">👑 Managers</button>
        <div id="user-info" class="user-info hidden">
          <img class="user-avatar" src="" alt="">
          <span class="user-name"></span>
          <span class="user-discord-id" style="font-size:0.7rem;color:var(--text-muted)"></span>
          <span class="manager-badge hidden">Manager</span>
          <button class="btn btn-sm" onclick="logout()">Logout</button>
        </div>
        <button id="login-btn" class="btn" onclick="loginWithDiscord()">Login with Discord</button>
      </div>
    </div>
  </header>

  <main class="container">
    <div id="raid-content">
      <div class="loading"><div class="spinner"></div></div>
      <div class="raid-detail-header">
        <a href="index.html" class="btn btn-sm" style="margin-bottom:12px">← All Raids</a>
        <h1 class="page-title" id="raid-title"></h1>
        <div class="raid-detail-meta" id="raid-meta"></div>
        <div class="raid-detail-actions" id="raid-actions"></div>
      </div>

      <div class="raid-description" id="raid-description"></div>

      <div id="signup-section" class="hidden">
        <div class="signup-form" id="signup-form">
          <h2>Sign Up for This Raid</h2>
          <div class="form-group">
            <label for="char-name">Character Name</label>
            <input type="text" id="char-name" class="form-control" placeholder="Your character name" required>
          </div>
          <div class="form-group">
            <label for="class-select">Class</label>
            <select id="class-select" class="form-control"></select>
          </div>
          <div class="form-group">
            <label for="spec-select">Specialization</label>
            <select id="spec-select" class="form-control"></select>
          </div>
          <div class="form-group">
            <label>Role</label>
            <div class="role-selector" id="role-selector"></div>
          </div>
          <button class="btn btn-primary btn-lg" style="width:100%;margin-top:8px" onclick="handleSignup()">Sign Up</button>
        </div>
        <div id="already-signed" class="card hidden" style="border-color:var(--accent-gold);margin-bottom:24px">
          <p style="text-align:center;padding:12px">
            You are signed up as <strong id="signed-character"></strong>
            · <a href="#" onclick="handleUnsign();return false" style="color:var(--danger)">Unsign</a>
          </p>
        </div>
      </div>

      <h2 class="section-title" style="margin-top:32px">Roster</h2>
      <div class="roster-grid" id="roster-grid">
        <div class="loading"><div class="spinner"></div></div>
      </div>
    </div>

    <div id="not-found" class="empty-state hidden">
      <div class="empty-icon">🔍</div>
      <h3>Raid not found</h3>
      <p class="page-subtitle">This raid may have been deleted.</p>
      <a href="index.html" class="btn" style="margin-top:16px">← All raids</a>
    </div>
  </main>

  <div class="toast-container" id="toast-container"></div>

  <script>
    setTimeout(function() {
      var els = document.querySelectorAll('.loading');
      for (var i = 0; i < els.length; i++) els[i].remove();
    }, 5000);
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script defer src="js/config.js"></script>
  <script defer src="js/data.js"></script>
  <script defer src="js/supabase.js"></script>
  <script defer src="js/auth.js"></script>
  <script defer src="js/raid.js"></script>
</body>
</html>

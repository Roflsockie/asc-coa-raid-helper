<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Raid-COA · Signups</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <div class="container">
      <a href="index.html" class="header-title">Raid<span>COA</span></a>
      <div class="header-actions">
        <button id="create-raid-btn" class="btn btn-primary hidden" onclick="location.href='create.html'">+ Create Raid</button>
        <button id="manage-managers-btn" class="btn btn-sm hidden" onclick="toggleManagerPanel()">👑 Managers</button>
        <div id="user-info" class="user-info hidden">
          <img class="user-avatar" src="" alt="">
          <span class="user-name"></span>
          <span class="user-discord-id" style="font-size:0.7rem;color:var(--text-muted)"></span>
          <span class="manager-badge hidden">Manager</span>
          <button class="btn btn-sm" onclick="logout()">Logout</button>
        </div>
        <button id="login-btn" class="btn" onclick="loginWithDiscord()">Login with Discord</button>
      </div>
    </div>
  </header>

  <main class="container">
    <div class="page-header">
      <div>
        <h1 class="page-title">Active Raids</h1>
        <p class="page-subtitle">Sign up for upcoming Conquest of Azeroth raids</p>
      </div>
    </div>

    <div id="raid-list">
      <div class="loading"><div class="spinner"></div></div>
    </div>

    <div id="empty-state" class="empty-state hidden">
      <div class="empty-icon">📋</div>
      <h3>No raids yet</h3>
      <p class="page-subtitle">Create the first raid to get started</p>
    </div>

    <div id="manager-panel" class="card hidden">
      <div class="card-header">
        <div>
          <div class="card-title">👑 Manager Management</div>
          <div class="card-subtitle">Add or remove guild managers</div>
        </div>
        <button class="btn btn-sm" onclick="toggleManagerPanel()">✕ Close</button>
      </div>
      <div id="manager-list"></div>
      <div class="manager-add-form">
        <h4 style="color:var(--accent-gold);margin-bottom:12px">Add Manager</h4>
        <div class="form-row" style="grid-template-columns:1fr auto">
          <input type="text" id="manager-input" class="form-control" placeholder="Discord ID (digits only)" style="font-family:var(--font-mono)">
          <button class="btn btn-primary" onclick="addManager()">+ Add</button>
        </div>
        <div class="form-hint">Ask the user for their Discord ID (right-click their name in Discord → Copy ID)</div>
      </div>
    </div>
  </main>

  <div class="toast-container" id="toast-container"></div>

  <script>
    setTimeout(function() {
      document.querySelectorAll('.loading').forEach(function(el) { el.remove(); });
    }, 5000);
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script defer src="js/config.js"></script>
  <script defer src="js/data.js"></script>
  <script defer src="js/supabase.js"></script>
  <script defer src="js/auth.js"></script>
  <script defer src="js/index.js"></script>
</body>
</html>

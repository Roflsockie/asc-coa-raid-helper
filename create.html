<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Raid · Raid-COA</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <div class="container">
      <a href="index.html" class="header-title">Raid<span>COA</span></a>
      <div class="header-actions">
        <button id="manage-managers-btn" class="btn btn-sm hidden" onclick="manageManagers()">👑 Managers</button>
        <div id="user-info" class="user-info hidden">
          <img class="user-avatar" src="" alt="">
          <span class="user-name"></span>
          <span class="user-discord-id" style="font-size:0.7rem;color:var(--text-muted)"></span>
          <span class="manager-badge hidden">Manager</span>
          <button class="btn btn-sm" onclick="logout()">Logout</button>
        </div>
        <button id="login-btn" class="btn" onclick="loginWithDiscord()">Login with Discord</button>
      </div>
    </div>
  </header>

  <main class="container">
    <div class="page-header">
      <div>
        <h1 class="page-title">Create Raid</h1>
        <p class="page-subtitle">Set up a new raid event</p>
      </div>
      <a href="index.html" class="btn">← Back</a>
    </div>

    <div id="not-manager" class="empty-state hidden">
      <div class="empty-icon">🔒</div>
      <h3>Access Denied</h3>
      <p class="page-subtitle">Only raid managers can create events.</p>
      <a href="index.html" class="btn" style="margin-top:16px">← Back to raids</a>
    </div>

    <form id="create-form" class="card" style="max-width:700px">
      <div class="form-group">
        <label for="title">Raid Title</label>
        <input type="text" id="title" class="form-control" placeholder="e.g. Molten Core – Tuesday" required>
      </div>

      <div class="form-group">
        <label for="description">Description (optional)</label>
        <textarea id="description" class="form-control" placeholder="Invite message, requirements, notes..." rows="3"></textarea>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="date">Date</label>
          <input type="date" id="date" class="form-control" required>
        </div>
        <div class="form-group">
          <label for="time">Time</label>
          <input type="time" id="time" class="form-control" required>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="tank_limit">🛡️ Tank Limit</label>
          <input type="number" id="tank_limit" class="form-control" value="3" min="0" max="40">
        </div>
        <div class="form-group">
          <label for="healer_limit">💚 Healer Limit</label>
          <input type="number" id="healer_limit" class="form-control" value="5" min="0" max="40">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="melee_limit">⚔️ Melee DPS Limit</label>
          <input type="number" id="melee_limit" class="form-control" value="8" min="0" max="40">
        </div>
        <div class="form-group">
          <label for="range_limit">🏹 Range DPS Limit</label>
          <input type="number" id="range_limit" class="form-control" value="9" min="0" max="40">
        </div>
      </div>

      <button type="submit" class="btn btn-primary btn-lg" style="width:100%;margin-top:8px">Create Raid</button>
    </form>
  </main>

  <div class="toast-container" id="toast-container"></div>

  <script>
    setTimeout(function() {
      document.querySelectorAll('.loading').forEach(function(el) { el.remove(); });
    }, 5000);
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script defer src="js/config.js"></script>
  <script defer src="js/data.js"></script>
  <script defer src="js/supabase.js"></script>
  <script defer src="js/auth.js"></script>
  <script defer src="js/create.js"></script>
</body>
</html>
